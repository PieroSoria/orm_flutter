name: Desktop engines
on:
  push:
  pull_request:
jobs:
  unit:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            device: macos
          - os: ubuntu-22.04
            device: linux
          - os: windows-latest
            device: windows
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: example
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev libssl-dev xvfb
      - run: flutter pub get
      - if: runner.os != 'Linux'
        run: flutter test integration_test/desktop_test.dart -d ${{ matrix.device }}
      - if: runner.os == 'Linux'
        run: xvfb-run -a flutter test integration_test/desktop_test.dart -d linux
      - run: flutter clean
      - run: flutter build ${{ matrix.device }} --release
